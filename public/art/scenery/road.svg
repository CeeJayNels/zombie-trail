<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a20"/>
      <stop offset="1" stop-color="#2a2e38"/>
    </linearGradient>
  </defs>
  <rect width="640" height="80" fill="url(#sky2)"/>
  <rect y="80" width="640" height="80" fill="#0e0f12"/>
  <path d="M0 160 L280 80 L360 80 L640 160 Z" fill="#1f2229"/>
  <path d="M260 80 L380 80 L500 160 L140 160 Z" fill="#2a2e38"/>
  <g stroke="#d6a35a" stroke-width="2.5" stroke-dasharray="14 12">
    <line x1="320" y1="85" x2="320" y2="160"/>
  </g>
  <g fill="#181a20">
    <path d="M30 100 L40 75 L50 100 Z"/>
    <path d="M90 95 L100 65 L110 95 Z"/>
    <path d="M540 90 L550 60 L560 90 Z"/>
    <path d="M600 100 L610 75 L620 100 Z"/>
  </g>
  <circle cx="560" cy="25" r="10" fill="#d6a35a" opacity="0.7"/>

  <!-- vehicle: beat-up station wagon, rear view receding down the road -->
  <g transform="translate(280 95)">
    <!-- shadow under vehicle -->
    <ellipse cx="40" cy="48" rx="42" ry="4" fill="#0e0f12" opacity="0.8"/>
    <!-- roof rack with gear -->
    <rect x="14" y="-6" width="52" height="4" fill="#181a20" stroke="#9aa0aa" stroke-width="0.5"/>
    <rect x="18" y="-12" width="18" height="6" fill="#2a2e38" stroke="#9aa0aa" stroke-width="0.5"/>
    <rect x="40" y="-14" width="14" height="8" fill="#2a2e38" stroke="#9aa0aa" stroke-width="0.5"/>
    <rect x="56" y="-10" width="10" height="4" fill="#d6a35a" stroke="#9aa0aa" stroke-width="0.3"/>
    <!-- body -->
    <path d="M10 0 L14 -4 L66 -4 L70 0 L78 20 L78 40 L72 44 L8 44 L2 40 L2 20 Z" fill="#2a2e38" stroke="#7ec96b" stroke-width="1.2"/>
    <!-- rear window -->
    <path d="M18 2 L62 2 L66 18 L14 18 Z" fill="#0e0f12" stroke="#7ec96b" stroke-width="0.8"/>
    <!-- tail lights -->
    <rect x="6" y="24" width="10" height="6" fill="#d65a5a"/>
    <rect x="64" y="24" width="10" height="6" fill="#d65a5a"/>
    <!-- license plate area / bumper -->
    <rect x="28" y="32" width="24" height="8" fill="#181a20" stroke="#9aa0aa" stroke-width="0.5"/>
    <!-- wheels -->
    <ellipse cx="14" cy="44" rx="8" ry="5" fill="#0e0f12" stroke="#9aa0aa" stroke-width="0.8"/>
    <ellipse cx="66" cy="44" rx="8" ry="5" fill="#0e0f12" stroke="#9aa0aa" stroke-width="0.8"/>
    <!-- exhaust puff -->
    <circle cx="-4" cy="36" r="4" fill="#9aa0aa" opacity="0.25"/>
    <circle cx="-10" cy="32" r="5" fill="#9aa0aa" opacity="0.15"/>
    <!-- headlight glow spilling backward -->
    <ellipse cx="40" cy="50" rx="60" ry="4" fill="#d6a35a" opacity="0.2"/>
  </g>
</svg>
